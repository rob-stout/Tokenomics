name: Tokenomics
options:
  bundleIdPrefix: com.robstout
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  # Lets us programmatically open the MenuBarExtra popover (no first-party API
  # exists). Used to pop the menu open at the end of onboarding.
  MenuBarExtraAccess:
    url: https://github.com/orchetect/MenuBarExtraAccess
    from: "1.3.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
schemes:
  Tokenomics:
    build:
      targets:
        Tokenomics: all
        # TokenomicsBridge is embedded in the app via its dependency (embed: true),
        # so it must NOT also be archived as a standalone scheme product. A bare
        # command-line-tool product in the archive makes `xcodebuild -exportArchive`
        # report "no valid distribution methods" (it can't distribute a CLI tool) —
        # the app dependency already builds + embeds the bridge.
        TokenomicsTests: [test]
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - name: TokenomicsTests
          parallelizable: true
          randomExecutionOrder: true

  TokenomicsIntegration:
    build:
      targets:
        Tokenomics: all
        TokenomicsIntegrationTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: TokenomicsIntegrationTests
          parallelizable: false
          randomExecutionOrder: false

  TokenomicsSafari:
    build:
      targets:
        TokenomicsSafari: all
        # TokenomicsSafariExtension is embedded via the app's dependency
        # (embed: true), so it must NOT also get a standalone scheme product —
        # same reasoning as TokenomicsBridge above.
    run:
      config: Debug
    archive:
      config: Release
targets:
  Tokenomics:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: MenuBarExtraAccess
        product: MenuBarExtraAccess
      - target: TokenomicsWidgets
        embed: true
      - target: TokenomicsBridge
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    sources:
      - path: Tokenomics
        excludes:
          - Resources
      - path: Tokenomics/Resources/Assets.xcassets
        buildPhase: resources
      - path: Tokenomics/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Tokenomics/Resources/Provider Icons/PNG/1x
        buildPhase: resources
      - path: Tokenomics/Resources/Provider Icons/PNG/2x
        buildPhase: resources
      - path: Tokenomics/Resources/Fonts
        buildPhase: resources
      - path: TokenomicsWidgets/TokenomicsWidgetEntryView.swift
        type: file
      - path: TokenomicsWidgets/WidgetIntent.swift
        type: file
      - path: TokenomicsWidgets/TokenomicsWidgets.swift
        type: file
      - path: TokenomicsBridge/BridgeCore.swift
        type: file
    info:
      path: Tokenomics/Resources/Info.plist
      properties:
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "2.9.1"
        CFBundleVersion: "65"
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: com.robstout.tokenomics
            CFBundleURLSchemes:
              - tokenomics
        SUFeedURL: https://raw.githubusercontent.com/rob-stout/Tokenomics/main/appcast.xml
        SUPublicEDKey: iykVNFpnZUJU85Quy7sBGwDg9zJHawXUt2OX6FxdyjE=
        SUEnableAutomaticChecks: true
        ATSApplicationFontsPath: ""
    entitlements:
      path: Tokenomics/Resources/Tokenomics.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.robstout.tokenomics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robstout.tokenomics
        PRODUCT_NAME: Tokenomics
        INFOPLIST_FILE: Tokenomics/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tokenomics/Resources/Tokenomics.entitlements
        ENABLE_APP_SANDBOX: NO
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        debug:
          # Program team for App Group support in debug builds
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: RPDDQP7KZ5
          CODE_SIGN_IDENTITY: "Apple Development"
        release:
          # Manual signing for Developer ID distribution
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: RPDDQP7KZ5
          CODE_SIGN_IDENTITY: "Developer ID Application"
          PROVISIONING_PROFILE_SPECIFIER: "Tokenomics Developer ID"

  TokenomicsWidgets:
    type: extensionkit-extension
    platform: macOS
    deploymentTarget:
      macOS: "14.0"
    sources:
      - path: TokenomicsWidgets
      - path: Tokenomics/Services/WidgetDataStore.swift
        type: file
      - path: Tokenomics/Resources/Provider Icons/PNG/1x
        buildPhase: resources
      - path: Tokenomics/Resources/Provider Icons/PNG/2x
        buildPhase: resources
    info:
      path: TokenomicsWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tokenomics Widgets
        CFBundleShortVersionString: "2.9.1"
        CFBundleVersion: "65"
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TokenomicsWidgets/TokenomicsWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.robstout.tokenomics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robstout.tokenomics.widgets
        PRODUCT_NAME: TokenomicsWidgets
        CODE_SIGN_ENTITLEMENTS: TokenomicsWidgets/TokenomicsWidgets.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
      configs:
        debug:
          # Program team for App Group support in debug builds
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: RPDDQP7KZ5
          CODE_SIGN_IDENTITY: "Apple Development"
        release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: RPDDQP7KZ5
          CODE_SIGN_IDENTITY: "Developer ID Application"
          PROVISIONING_PROFILE_SPECIFIER: "Tokenomics Widget Developer ID"

  TokenomicsBridge:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: TokenomicsBridge
      - path: Tokenomics/Models/BridgeWireTypes.swift
        type: file
      - path: Tokenomics/Models/ProviderVisibilitySetting.swift
        type: file
    # No entitlements: this CLI tool reads the group container by path (see
    # BridgeCore.containerURL). An App Group entitlement here can't be authorized
    # for Developer ID (tools take no provisioning profile) and breaks export.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robstout.tokenomics.bridge
        PRODUCT_NAME: TokenomicsBridge
        # Embedded in the app via the dependency copy phase — do NOT also install
        # it as a standalone archive product (usr/local/bin). A bare CLI-tool
        # product makes exportArchive report "no valid distribution methods".
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
      configs:
        debug:
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: RPDDQP7KZ5
          CODE_SIGN_IDENTITY: "Apple Development"
        release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: RPDDQP7KZ5
          CODE_SIGN_IDENTITY: "Developer ID Application"
          # Command-line tool targets don't support provisioning profiles —
          # Developer ID signing uses the identity directly. (A specifier here
          # fails the Release archive: "TokenomicsBridge does not support
          # provisioning profiles".)

  # "Tokenomics for Safari" — the Mac App Store companion that hosts the
  # Safari Web Extension (see docs/plan: Safari + Mac App Store). Sandboxed,
  # no Sparkle, no network entitlement (the extension does its own fetching;
  # this app only reads the shared App Group container for status display).
  TokenomicsSafari:
    type: application
    platform: macOS
    deploymentTarget:
      macOS: "14.0"
    dependencies:
      - target: TokenomicsSafariExtension
        embed: true
    sources:
      - path: TokenomicsSafari
      - path: TokenomicsBridge/BridgeCore.swift
        type: file
      - path: Tokenomics/Models/BridgeWireTypes.swift
        type: file
      - path: Tokenomics/Models/ProviderVisibilitySetting.swift
        type: file
      - path: Tokenomics/Views/DesignSystem/Tokens.swift
        type: file
      - path: Tokenomics/Views/DesignSystem/TokenButtonStyle.swift
        type: file
      # Reuses the main app's icon + bundled onboarding fonts so the
      # shared Tokens.swift button/typography styles render on-brand.
      # TODO(Phase 5/6): dedicated smaller MAS-only asset catalog.
      - path: Tokenomics/Resources/Assets.xcassets
        buildPhase: resources
      - path: Tokenomics/Resources/Fonts
        buildPhase: resources
    info:
      path: TokenomicsSafari/Info.plist
      properties:
        CFBundleDisplayName: Tokenomics for Safari
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ATSApplicationFontsPath: ""
        # Required by the Mac App Store — a missing or non-UTI value is
        # rejected at upload (the archive's "No App Category" warning).
        # Must match the category chosen in App Store Connect.
        LSApplicationCategoryType: public.app-category.utilities
    entitlements:
      path: TokenomicsSafari/TokenomicsSafari.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.robstout.tokenomics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robstout.tokenomics.safari
        PRODUCT_NAME: Tokenomics for Safari
        INFOPLIST_FILE: TokenomicsSafari/Info.plist
        CODE_SIGN_ENTITLEMENTS: TokenomicsSafari/TokenomicsSafari.entitlements
        ENABLE_APP_SANDBOX: YES
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
      configs:
        debug:
          # Program team for App Group support in debug builds
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: RPDDQP7KZ5
          CODE_SIGN_IDENTITY: "Apple Development"
        release:
          # Automatic signing for Mac App Store distribution (Phase 5).
          # Manual + no PROVISIONING_PROFILE_SPECIFIER was tried first (it's
          # what the Developer-ID targets use) and empirically FAILS archiving
          # outright: "requires a provisioning profile. Select a provisioning
          # profile in the Signing & Capabilities editor." — Manual signing
          # needs a real profile name/UUID, and no App Store profile exists
          # yet for com.robstout.tokenomics.safari (the App ID itself isn't
          # registered in the developer portal yet). Automatic + xcodebuild's
          # `-allowProvisioningUpdates` (passed by distribute-appstore.sh) lets
          # Xcode create the missing App ID/profile via the API key — the
          # standard MAS-from-CI pattern.
          #
          # No CODE_SIGN_IDENTITY here (unlike the Developer-ID release configs
          # above) — pinning it to "Apple Distribution" alongside
          # CODE_SIGN_STYLE: Automatic also empirically FAILS: "conflicting
          # provisioning settings... automatically signed for development, but
          # a conflicting code signing identity Apple Distribution has been
          # manually specified." With Automatic signing, Xcode picks the
          # identity type itself from the archive/export action — no need (and
          # no room) to pin it. Once App Store profiles exist, this can switch
          # to Manual + PROVISIONING_PROFILE_SPECIFIER + CODE_SIGN_IDENTITY for
          # reproducible, portal-independent builds — same as Developer ID.
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: RPDDQP7KZ5

  # The Safari Web Extension appex, embedded in TokenomicsSafari's
  # Contents/PlugIns. Its bundle id must be a child of the containing app's
  # (xcodebuild hard-errors otherwise). Hosts the SAME web-extension bundle
  # (extension/dist-safari) that ships identically-behaving JS to Chrome —
  # only the native bridge transport differs (in-process handler vs stdio).
  TokenomicsSafariExtension:
    type: app-extension
    platform: macOS
    deploymentTarget:
      macOS: "14.0"
    sources:
      - path: TokenomicsSafariExtension
      - path: TokenomicsBridge/BridgeCore.swift
        type: file
      - path: Tokenomics/Models/BridgeWireTypes.swift
        type: file
      - path: Tokenomics/Models/ProviderVisibilitySetting.swift
        type: file
      # extension/dist-safari is a build artifact (produced by
      # `node build.mjs --safari`, gitignored like dist/) — sources marked
      # `optional: true` so `xcodegen generate` still succeeds (e.g. via the
      # post-checkout hook) on a checkout where it hasn't been built yet.
      # Layout matches SFSafariWebExtensionConverter's convention: manifest +
      # background.js at the Resources root, subfolders as folder references
      # (`type: folder`) so their own relative paths (e.g. "content/x.js")
      # match what manifest.json declares.
      - path: extension/dist-safari/manifest.json
        buildPhase: resources
        optional: true
      - path: extension/dist-safari/background.js
        buildPhase: resources
        optional: true
      - path: extension/dist-safari/content
        type: folder
        buildPhase: resources
        optional: true
      - path: extension/dist-safari/options
        type: folder
        buildPhase: resources
        optional: true
      - path: extension/dist-safari/popup
        type: folder
        buildPhase: resources
        optional: true
      - path: extension/dist-safari/icons
        type: folder
        buildPhase: resources
        optional: true
    info:
      path: TokenomicsSafariExtension/Info.plist
      properties:
        CFBundleDisplayName: Tokenomics for Safari
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: TokenomicsSafariExtension/TokenomicsSafariExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.robstout.tokenomics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robstout.tokenomics.safari.extension
        PRODUCT_NAME: TokenomicsSafariExtension
        CODE_SIGN_ENTITLEMENTS: TokenomicsSafariExtension/TokenomicsSafariExtension.entitlements
        ENABLE_APP_SANDBOX: YES
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
      configs:
        debug:
          # Program team for App Group support in debug builds
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: RPDDQP7KZ5
          CODE_SIGN_IDENTITY: "Apple Development"
        release:
          # Same reasoning as TokenomicsSafari above — Manual-without-profile
          # empirically fails archiving, and pinning CODE_SIGN_IDENTITY
          # alongside Automatic style empirically conflicts too. Automatic +
          # -allowProvisioningUpdates (no identity pin) is used until App
          # Store provisioning profiles exist for Phase 5.
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: RPDDQP7KZ5

  TokenomicsTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget:
      macOS: "14.0"
    sources:
      - path: TokenomicsTests
        excludes:
          - Fixtures
      - path: TokenomicsTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Tokenomics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robstout.tokenomics.tests
        PRODUCT_NAME: TokenomicsTests
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
      configs:
        debug:
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: RPDDQP7KZ5

  TokenomicsIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget:
      macOS: "14.0"
    sources:
      - path: TokenomicsIntegrationTests
    dependencies:
      - target: Tokenomics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robstout.tokenomics.integration-tests
        PRODUCT_NAME: TokenomicsIntegrationTests
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
      configs:
        debug:
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: RPDDQP7KZ5
